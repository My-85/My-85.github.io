<body data-page="replay"><header class="site-header"><a class="brand" href="index.html" title="Geometry-guided Imitation for Flight Tracking" aria-label="GIFT 飞行工作台首页"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M5 26C12 27 9 8 18 8S24 29 32 18"/><path d="M5 5v6M2 8h6M29 27v6M26 30h6"/><circle cx="5" cy="26" r="2"/><circle cx="32" cy="18" r="2"/></svg><span><strong>GIFT</strong><small>FLIGHT WORKSPACE</small></span></a><nav aria-label="主导航"><a href="index.html" aria-current="page">飞行回放</a><a href="custom.html">轨迹编辑</a><a href="report.html">技术方法</a><a class="nav-source" href="https://github.com/My-85/My-85.github.io/tree/main/gift" target="_blank" rel="noopener">GitHub</a></nav></header>
<main><section class="page-heading"><div><p class="project-label">FLIGHT RECORDS</p><h1>飞行回放</h1><p class="lead">参考路线与实际航迹，按记录逐条查看。</p></div><a class="primary button" href="custom.html">绘制新轨迹 <span aria-hidden="true">↗</span></a></section>
<section id="explore" class="workbench" aria-label="飞行回放工作台"><aside class="routes"><div class="sidebar-heading"><span>飞行记录</span><span class="index-label">ARCHIVE</span></div><label for="dataset">选择飞行记录</label><select id="dataset"><option value="new">最新进展 · 3 条自主修复</option><option value="keeper">保留模型 · 完整 392 项评测</option><option value="coverage">最新诊断 · 完整 64 项补课</option></select><p id="set-note" class="set-note"></p><div class="filter-row"><label class="sr-only" for="status">按结果筛选</label><select id="status"><option value="all">全部结果</option><option value="pass">通过</option><option value="fail">未通过</option><option value="refused">未飞行</option><option value="recorded">历史实飞</option></select><label class="sr-only" for="search">搜索路线</label><input id="search" placeholder="编号、机动、模型" type="search"></div><div id="list-count" class="list-count"></div><div id="route-list" class="route-list" aria-label="飞行路线列表"></div></aside><div class="flight-panel">
<div class="flight-heading"><div><span id="case-badge" class="badge"></span><h3 id="case-title">读取飞行记录…</h3></div><span id="cp" class="mono"></span></div>
<div class="viewport-wrap"><div id="viewport" aria-label="三维航迹视图，拖动旋转，滚轮缩放"></div><div id="render-error" hidden></div><div class="view-tools" aria-label="视图切换"><button data-view="perspective" title="三维视角">三维</button><button data-view="top">俯视</button><button data-view="side">侧视</button><button id="fullscreen">全屏</button></div><div class="legend"><span><i class="ref"></i>参考路线</span><span><i class="actual"></i>实际航迹</span></div><div class="view-foot">坐标 / km · 三轴等比例 · 飞机符号放大</div><div class="telemetry" id="telemetry"></div><div id="no-flight" hidden>未飞行，仅显示参考路线。</div></div>
<div class="transport"><button id="play" class="primary" aria-label="播放飞行">▶ 播放</button><input id="scrub" aria-label="飞行时间轴" type="range" min="0" max="100" value="0" step="0.01"><output id="time">0.0 / 0.0 s</output><label class="sr-only" for="speed">播放速度</label><select id="speed"><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option><option value="8">8×</option></select></div>
<div class="metrics" id="metrics"></div><div class="chart-wrap"><div class="chart-label"><span>跟踪误差 / m</span><span>P90 参考门槛 150 m</span></div><canvas id="chart" aria-label="跟踪误差随时间变化"></canvas></div>
