async function main(){const r=await fetch('report.md');if(!r.ok)throw Error('report');const md=await r.text();const formulas=[];const safe=md.replace(/\$\$([\s\S]*?)\$\$/g,(_,tex)=>{const id=formulas.length;formulas.push({tex,display:true});return `\n\nMATHBLOCKTOKEN${id}END\n\n`;}).replace(/\$([^\n$]+)\$/g,(_,tex)=>{const id=formulas.length;formulas.push({tex,display:false});return `MATHINLINETOKEN${id}END`;});let html=marked.parse(safe);html=html.replace(/(?:<p>)?MATHBLOCKTOKEN(\d+)END(?:<\/p>)?/g,(_,i)=>'<div class="mathblock">'+katex.renderToString(formulas[+i].tex,{displayMode:true,throwOnError:true})+'</div>');html=html.replace(/MATHINLINETOKEN(\d+)END/g,(_,i)=>katex.renderToString(formulas[+i].tex,{displayMode:false,throwOnError:true}));document.getElementById('article').innerHTML=html;window.__reportReady={formulas:formulas.length};document.getElementById('copy').onclick=async()=>{try{if(window.ClipboardItem){const item=new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([document.getElementById('article').innerText],{type:'text/plain'})});await navigator.clipboard.write([item]);}else await navigator.clipboard.writeText(md);document.getElementById('copy-status').textContent='已复制。公式如未保留，请使用飞书公式块或 PDF。';}catch{const selection=window.getSelection();selection.removeAllRanges();const range=document.createRange();range.selectNodeContents(document.getElementById('article'));selection.addRange(range);document.getElementById('copy-status').textContent='已选中全文，请按 Ctrl/Cmd+C。';}};}
main().catch(e=>{document.getElementById('article').textContent='加载或公式渲染失败：'+e.message;window.__reportError=e.message;});
